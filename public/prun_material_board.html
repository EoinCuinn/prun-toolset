<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrUn Material Board</title>
<style>
  :root {
    --bg: #0f1117; --bg2: #181c27; --bg3: #1e2333;
    --border: #2a3045; --border2: #3a4460;
    --text: #e2e8f0; --text2: #8892a4; --text3: #555f72;
    --accent: #4f8ef7; --green: #4ade80; --orange: #fb923c; --red: #f87171; --yellow: #facc15;
    --mono: 'Courier New', monospace; --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; padding: 1.5rem;
    max-width: 1500px; margin: 0 auto;
  }

  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
       color: var(--text2); display: flex; align-items: center; gap: 8px; }
  h1::before { content: ''; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .input-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
  input, select {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); padding: 8px 10px; font-size: 13px; font-family: var(--mono); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  button {
    background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); padding: 8px 14px; font-size: 13px; font-family: inherit; cursor: pointer;
    transition: background 0.15s, border-color 0.15s; white-space: nowrap;
  }
  button:hover { background: var(--border); border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: #6aa0f9; }
  button.small { padding: 5px 10px; font-size: 12px; font-family: var(--mono); color: var(--text2); }
  button.chip { padding: 5px 12px; font-size: 12px; border-radius: 999px; color: var(--text2); }
  button.chip.active { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.08); }

  .status { font-size: 13px; color: var(--text2); margin-bottom: 1rem; min-height: 16px; font-family: var(--mono); }
  .spinner { display:inline-block; width:10px; height:10px; margin-right:6px; border:2px solid var(--border);
             border-top-color: var(--accent); border-radius:50%; animation: spin .8s linear infinite; vertical-align:-1px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .toolbar input[type="text"] { width: 240px; }
  .count { font-size: 12px; font-family: var(--mono); color: var(--text3); margin-left: auto; }

  /* ── material list ── */
  .list-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg2); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 9px 10px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text3); border-bottom: 1px solid var(--border);
    white-space: nowrap; background: var(--bg3); cursor: pointer; user-select: none;
  }
  th.plain { cursor: default; }
  th:hover:not(.plain) { color: var(--accent); }
  th.r, td.r { text-align: right; }
  th .arrow { color: var(--accent); margin-left: 4px; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr.data-row { cursor: pointer; }
  tbody tr.data-row:hover td { background: var(--bg3); }
  tbody tr.data-row:last-child td { border-bottom: 1px solid var(--border); }
  tbody tr.data-row.open td { background: var(--bg3); border-bottom-color: transparent; }
  .caret { display: inline-block; width: 10px; color: var(--text3); transition: transform 0.15s; }
  tr.open .caret { transform: rotate(90deg); color: var(--accent); }
  .mat { font-family: var(--mono); font-weight: 700; }
  .mat-name { font-size: 11px; color: var(--text3); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--text2); }
  .dim { color: var(--text3); }
  .good { color: var(--green); }
  .warn { color: var(--orange); }
  .bad { color: var(--red); }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .empty-state { padding: 32px 16px; text-align: center; color: var(--text3); font-size: 13px; font-family: var(--mono); }

  /* ── expanded detail ── */
  .detail-cell { padding: 0 !important; background: var(--bg); border-bottom: 1px solid var(--border2) !important; }
  .detail { padding: 14px 16px 18px; }
  .detail-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .detail-head .dstat { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
  .detail-head .dval { font-size: 16px; font-family: var(--mono); }
  .detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .detail-cols { grid-template-columns: 1fr; } }
  .subpanel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .subpanel-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
                    color: var(--text3); padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg3); }
  .subpanel table { font-size: 12px; }
  .subpanel th { background: transparent; border-bottom: 1px solid var(--border); padding: 6px 12px; cursor: default; font-size: 11px; }
  .subpanel td { padding: 6px 12px; }
  tfoot td { background: var(--bg3); border-top: 1px solid var(--border2); border-bottom: none;
             font-size: 11px; font-weight: 600; font-family: var(--mono); color: var(--text2); }

  .sell-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .sell-row input[type="number"] { width: 110px; }
  .sell-answer { font-size: 14px; margin-top: 8px; min-height: 20px; }
  .sell-answer .yes { color: var(--green); font-weight: 700; }
  .sell-answer .no { color: var(--red); font-weight: 700; }

  details summary { cursor: pointer; color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
  textarea { width: 100%; min-height: 200px; background: var(--bg); border: 1px solid var(--border);
             border-radius: var(--radius); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 10px; }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 12px 0; }
  .settings-grid label { display: block; font-size: 11px; color: var(--text3); text-transform: uppercase;
                         letter-spacing: 0.08em; margin-bottom: 4px; }
  .export-pre { margin: 0 12px 8px; padding: 10px; background: var(--bg); border: 1px solid var(--border);
                border-radius: var(--radius); font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-all; }
  .editor-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .editor-add input, .editor-add select { padding: 5px 7px; font-size: 12px; }
  #editorHost table { font-size: 12px; }
  #editorHost th { padding: 6px 8px; font-size: 11px; cursor: default; }
  #editorHost td { padding: 4px 6px; }
  #editorHost input, #editorHost select { width: 100%; padding: 4px 6px; font-size: 12px; font-family: var(--mono); }
  #editorHost input[type="number"] { width: 80px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .panel-head:hover .panel-title { color: var(--text2); }
  .chev { color: var(--text3); font-size: 12px; transition: transform 0.15s; }
  .panel.collapsed .chev { transform: rotate(-90deg); }
  .panel.collapsed .panel-body { display: none; }
  .panel-title { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 0.75rem; }
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-top: 1rem; }
</style>
</head>
<body>

<div class="top">
  <h1>Material Board</h1>
  <span id="buildTag" class="dim" style="font-size:10px;font-family:var(--mono);"></span>
  <span id="cfgTag" class="dim" style="font-size:10px;font-family:var(--mono);"></span>
  <span class="input-label">Player</span>
  <input id="userInput" value="eoincuinn" style="width:110px">
  <span class="input-label">FIO key</span>
  <input id="fioKeyInput" type="password" placeholder="FIO REST key" style="width:160px">
  <span class="input-label">PUNoted</span>
  <input id="pnKeyInput" type="password" placeholder="token" style="width:140px">
  <button class="primary" onclick="loadAll(true)">↺ LOAD</button>
  <button class="small" onclick="toggleAllPanels()">COLLAPSE ALL</button>
</div>

<datalist id="matList"></datalist>

<div class="status" id="statusBar">Enter your keys and press LOAD.</div>

<div class="panel" id="panel-materials">
  <div class="panel-head" onclick="togglePanel('materials')">
    <span class="panel-title" style="margin:0">Materials <span id="matCount" class="dim"></span></span>
    <span class="chev">▾</span>
  </div>
  <div class="panel-body" id="body-materials">
<div class="toolbar">
  <input id="searchInput" type="text" placeholder="search material…" oninput="render()">
  <button class="chip active" data-filter="all" onclick="setFilter('all')">All</button>
  <button class="chip" data-filter="below" onclick="setFilter('below')">Below reserve</button>
  <button class="chip" data-filter="fast" onclick="setFilter('fast')">Selling too fast</button>
  <button class="chip" data-filter="commitments" onclick="setFilter('commitments')">Commitments</button>
  <button class="chip" data-filter="contracts" onclick="setFilter('contracts')">Has contracts</button>
  <button class="chip" data-filter="nostock" onclick="setFilter('nostock')">No stock</button>
  <span class="count" id="countLabel"></span>
</div>

<div class="list-wrap">
  <div id="listHost"><div class="empty-state">Load your keys to see every material you make, use, hold or owe.</div></div>
</div>
  </div>
</div>

<div class="panel" id="panel-commitments">
  <div class="panel-head" onclick="togglePanel('commitments')">
    <span class="panel-title" style="margin:0">Commitments <span id="commitCount" class="dim"></span></span>
    <span class="chev">▾</span>
  </div>
  <div class="panel-body" id="body-commitments">
    <div class="table-wrap"><div id="commitSummary"><div class="empty-state">Load your keys to see commitments.</div></div></div>
    <div id="exportPanel" class="hidden"></div>
  </div>
</div>

<div class="panel">
  <details>
    <summary>Settings — commitments, horizon, reserves</summary>
    <div class="settings-grid">
      <div><label>Horizon (days)</label><input id="horizonInput" type="number" min="1" max="60" value="7" style="width:100%"></div>
      <div><label>Reserve: days of usage</label><input id="reserveUseInput" type="number" min="0" max="120" value="16" style="width:100%"></div>
      <div><label>Reserve: days of production</label><input id="reserveProdInput" type="number" min="0" max="120" value="16" style="width:100%"></div>
    </div>

    <div class="panel-title" style="margin-top:16px;">Commitments</div>
    <div class="table-wrap"><div id="editorHost"></div></div>

    <div class="editor-add">
      <input id="newPerson" placeholder="person" style="width:120px">
      <input id="newLocation" placeholder="location" style="width:120px">
      <select id="newCont"><option value="">cont —</option><option value="me">I raise</option><option value="them">they raise</option></select>
      <select id="newDir"><option value="sell">sell</option><option value="buy">buy</option></select>
      <input id="newMaterial" list="matList" placeholder="material" style="width:90px">
      <input id="newUnits" type="number" min="0" placeholder="rate" style="width:80px">
      <input id="newPrice" type="number" min="0" step="0.01" placeholder="price" style="width:80px">
      <select id="newPer"><option value="week">/week</option><option value="day">/day</option></select>
      <select id="newDue"><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option></select>
      <input id="newStart" type="date" title="starts (optional)" style="width:135px">
      <input id="newNote" placeholder="note" style="width:140px">
      <button class="small" onclick="addCommit()">ADD</button>
    </div>

    <details style="margin-top:16px;">
      <summary>Advanced (JSON)</summary>
      <label style="display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:8px 0 4px;">
        Config JSON — commitments and reserve overrides
      </label>
      <textarea id="cfgText"></textarea>
      <div style="margin-top:8px;"><button class="small" onclick="saveConfig()">SAVE JSON</button></div>
    </details>

    <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
      <button class="small" onclick="resetConfig()">RESET TO DEFAULT</button>
      <button class="small" onclick="exportConfig()">EXPORT</button>
      <button class="small" onclick="document.getElementById('importFile').click()">IMPORT</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importConfig(this)">
    </div>
  </details>
</div>

<script>
const FIO_BASE = 'https://rest.fnar.net';
const PN_BASE  = 'https://api.punoted.net/v1';
const CACHE_TTL = 5 * 60 * 1000;
const LS = { fio: 'prun_apikey', pn: 'prun_punoted_allkey', user: 'prun_cis_user', cfg: 'prun_cis_cfg' };
const BUILD = '2026-11-21f';
// Temporary: hide counterparty names until they are supplied.
const MASK_COUNTERPARTY = true;   // shown in the header so a stale cached page is obvious

const DEFAULT_CFG = {
  horizonDays: 7,
  defaultExchange: 'IC1',
  reserveDays: { usage: 16, production: 16 },
  commitments: [
    { counterparty: 'COSM player', material: 'RAT', units: 3500, per: 'week', due: 'Mon', dir: 'sell', price: 0, location: '', cont: '' },
    { counterparty: 'COSM player', material: 'DW',  units: 3500, per: 'week', due: 'Mon', dir: 'sell', price: 0, location: '', cont: '' },
    { counterparty: 'COSM player', material: 'PSL', units: 450,  per: 'week', due: 'Sat', dir: 'sell', price: 0, location: '', cont: '' },
    { counterparty: 'COSM player', material: 'PSM', units: 450,  per: 'week', due: 'Sat', dir: 'sell', price: 0, location: '', cont: '' },
    { counterparty: 'COSM player', material: 'DCM', units: 14,   per: 'day',  due: 'Sat', dir: 'sell', price: 0, location: '', cont: '', activeFrom: '2026-11-22' },
    { counterparty: 'COSM player', material: 'PG',  units: 4000, per: 'day',  due: 'Mon', dir: 'sell', price: 0, location: '', cont: '' },
    { counterparty: 'COSM player', material: 'BTS', units: 750,  per: 'week', due: 'Sat', dir: 'sell', price: 0, location: 'Helion Prime', cont: 'me' },
    { counterparty: 'COSM player', material: 'GL',  units: 300,  per: 'week', due: 'Sat', dir: 'sell', price: 0, location: '', cont: '' },
  ],
  reserve: {},
};

let MATERIALS = [];
let DATA = null;
let CFG = JSON.parse(JSON.stringify(DEFAULT_CFG));
let MODEL = [];          // computed rows
let SORT = { key: 'status', dir: 1 };
let FILTER = 'all';
let OPEN = null;         // expanded ticker

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('en-US');
const contLabel = v => v === 'me' ? 'I raise' : v === 'them' ? 'they raise' : '—';
const whoName = w => MASK_COUNTERPARTY ? 'COSM player' : w;
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function dateOf(v) {
  if (!v) return '—';
  const d = typeof v === 'number' ? new Date(v) : new Date(String(v));
  return isNaN(d) ? String(v).slice(0, 10) : d.toISOString().slice(0, 10);
}
function setStatus(kind, msg) {
  const el = $('statusBar');
  el.innerHTML = (kind === 'busy' ? '<span class="spinner"></span>' : '') + esc(msg);
  el.style.color = kind === 'err' ? 'var(--red)' : 'var(--text2)';
}

// ── collapsible panels ──────────────────────────────────────────────────────
const PANEL_KEY = 'prun_mb_panels';
let PANELS = { materials: true, commitments: true };
function loadPanels() {
  try {
    const p = JSON.parse(localStorage.getItem(PANEL_KEY) || 'null');
    if (p) PANELS = Object.assign(PANELS, p);
  } catch (e) { /* ignore */ }
  applyPanels();
}
function savePanels() { localStorage.setItem(PANEL_KEY, JSON.stringify(PANELS)); }
function applyPanels() {
  for (const n of ['materials', 'commitments']) {
    const el = document.getElementById('panel-' + n);
    if (el) el.classList.toggle('collapsed', !PANELS[n]);
  }
}
function togglePanel(name) {
  PANELS[name] = !PANELS[name];
  savePanels();
  applyPanels();
}
function toggleAllPanels() {
  const anyOpen = PANELS.materials || PANELS.commitments;
  PANELS.materials = PANELS.commitments = !anyOpen;
  savePanels();
  applyPanels();
}

// ── config ──────────────────────────────────────────────────────────────────
function loadConfig() {
  let saved = false;
  try {
    const raw = localStorage.getItem(LS.cfg);
    if (raw) { CFG = Object.assign({}, DEFAULT_CFG, JSON.parse(raw)); saved = true; }
  } catch (e) { CFG = JSON.parse(JSON.stringify(DEFAULT_CFG)); }
  renderConfig();
  const tag = document.getElementById('cfgTag');
  if (tag) tag.textContent = saved ? 'cfg: saved' : 'cfg: defaults';
}
function renderConfig() {
  $('horizonInput').value = CFG.horizonDays;
  $('reserveUseInput').value = CFG.reserveDays.usage;
  $('reserveProdInput').value = CFG.reserveDays.production;
  $('cfgText').value = JSON.stringify({ commitments: CFG.commitments, reserve: CFG.reserve }, null, 2);
  renderEditor();
}
function markSaved() {
  const tag = document.getElementById('cfgTag');
  if (tag) tag.textContent = 'cfg: saved';
}

function exportConfig() {
  const payload = { app: 'prun-material-board', version: 1, exported: new Date().toISOString(), config: CFG };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'material-board-config-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  setStatus('ok', 'Config exported.');
}

async function importConfig(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const cfg = data && data.config ? data.config : data;
    if (!cfg || typeof cfg !== 'object') throw new Error('not a config file');
    CFG = Object.assign({}, DEFAULT_CFG, cfg);
    localStorage.setItem(LS.cfg, JSON.stringify(CFG));
    renderConfig();
    markSaved();
    if (DATA) buildModel();
    setStatus('ok', 'Config imported.');
  } catch (e) {
    setStatus('err', 'Import failed: ' + e.message);
  } finally {
    input.value = '';
  }
}

function renderEditor() {
  const host = document.getElementById('editorHost');
  if (!host) return;
  const list = CFG.commitments || [];
  if (!list.length) { host.innerHTML = '<div class="empty-state">No commitments yet. Add one below.</div>'; return; }
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayOpts = cur => days.map(d => `<option ${d === cur ? 'selected' : ''}>${d}</option>`).join('');
  host.innerHTML = `<table><thead><tr>
      <th>Person</th><th>Location</th><th>Cont</th><th>Dir</th><th>Material</th><th class="r">Rate</th><th class="r">Price</th><th>Per</th><th>Due</th><th>Starts</th><th>Note</th><th></th>
    </tr></thead><tbody>
    ${list.map((c, i) => `<tr>
      <td><input value="${esc(c.counterparty || '')}" onchange="updateCommit(${i},'counterparty',this.value)"></td>
      <td><input value="${esc(c.location || '')}" onchange="updateCommit(${i},'location',this.value)"></td>
      <td><select onchange="updateCommit(${i},'cont',this.value)">
        <option value="" ${!c.cont ? 'selected' : ''}>—</option>
        <option value="me" ${c.cont === 'me' ? 'selected' : ''}>I raise</option>
        <option value="them" ${c.cont === 'them' ? 'selected' : ''}>they raise</option>
      </select></td>
      <td><select onchange="updateCommit(${i},'dir',this.value)">
        <option value="sell" ${c.dir !== 'buy' ? 'selected' : ''}>sell</option>
        <option value="buy" ${c.dir === 'buy' ? 'selected' : ''}>buy</option>
      </select></td>
      <td><input list="matList" value="${esc(c.material || '')}" onchange="updateCommit(${i},'material',this.value.toUpperCase())"></td>
      <td class="r"><input type="number" min="0" value="${c.units != null ? c.units : ''}" onchange="updateCommit(${i},'units',+this.value||0)"></td>
      <td class="r"><input type="number" min="0" step="0.01" value="${c.price ? c.price : ''}" onchange="updateCommit(${i},'price',+this.value||0)"></td>
      <td><select onchange="updateCommit(${i},'per',this.value)">
        <option value="week" ${c.per !== 'day' ? 'selected' : ''}>/week</option>
        <option value="day" ${c.per === 'day' ? 'selected' : ''}>/day</option>
      </select></td>
      <td><select onchange="updateCommit(${i},'due',this.value)">${dayOpts(c.due || 'Sat')}</select></td>
      <td><input type="date" value="${esc(c.activeFrom || '')}" onchange="updateCommit(${i},'activeFrom',this.value)"></td>
      <td><input value="${esc(c.note || '')}" onchange="updateCommit(${i},'note',this.value)"></td>
      <td><button class="small" onclick="deleteCommit(${i})">✕</button></td>
    </tr>`).join('')}
    </tbody></table>`;
}

function persistCommitments() {
  localStorage.setItem(LS.cfg, JSON.stringify(CFG));
  markSaved();
  if (DATA) buildModel();
}
function updateCommit(i, field, value) {
  if (!CFG.commitments[i]) return;
  CFG.commitments[i][field] = value;
  persistCommitments();
}

// ── per-material data ───────────────────────────────────────────────────────
const TYPE_LABEL = {
  SHIP_STORE: 'Ship', WAREHOUSE_STORE: 'Warehouse', STORE: 'Store',
  STL_FUEL_STORE: 'STL fuel', FTL_FUEL_STORE: 'FTL fuel',
};
const nameOf = t => (MATERIALS.find(m => m.Ticker === t) || {}).Name || '';

function stockRows(t) {
  // Warehouses/stores carry no name in /storage — map their ids to planets.
  const siteMap = new Map((DATA.sites || []).map(s => [s.SiteId, s.PlanetName]));
  const whMap = new Map();
  for (const w of (DATA.warehouses || [])) {
    const addr = String(w.WarehouseId || '').split('-')[0];
    if (addr) whMap.set(addr, w.LocationName);
  }

  const rows = [];
  for (const st of DATA.storage) {
    let amt = 0;
    for (const it of (st.StorageItems || [])) {
      if (it.MaterialTicker !== t) continue;
      amt += +(it.MaterialAmount != null ? it.MaterialAmount : it.Amount) || 0;
    }
    if (amt <= 0) continue;

    let where = st.Name || '';
    if (!where) {
      if (st.Type === 'STORE') where = siteMap.get(st.AddressableId) || 'Base store';
      else if (st.Type === 'WAREHOUSE_STORE') where = whMap.get(st.AddressableId) || 'Warehouse';
      else where = TYPE_LABEL[st.Type] || st.Type || '?';
    }
    rows.push({ name: where, type: TYPE_LABEL[st.Type] || st.Type || '—', amt });
  }
  return rows.sort((a, b) => b.amt - a.amt);
}
function burnRows(t) {
  const rows = [];
  if (!DATA.burn) return rows;
  for (const planet of Object.keys(DATA.burn)) {
    let p = 0, c = 0;
    for (const r of (DATA.burn[planet] || [])) if (r.MaterialTicker === t) { p += +r.Production || 0; c += +r.Consumption || 0; }
    if (p || c) rows.push({ planet, prod: p, cons: c, net: p - c });
  }
  return rows.sort((a, b) => a.net - b.net);
}
// Party is the COUNTERPARTY's role: CUSTOMER = they buy from us (we deliver).
function contractRows(t) {
  const rows = [];
  for (const c of DATA.contracts) {
    const status = String(c.Status || '').toUpperCase();
    if (['CLOSED', 'CANCELLED', 'TERMINATED'].includes(status)) continue;
    for (const k of (c.Conditions || [])) {
      if (String(k.Type || '').toUpperCase() !== 'DELIVERY') continue;
      const tk = k.MaterialTicker || k.QuantityMaterialTicker;
      if (tk !== t) continue;
      if (String(k.Status || '').toUpperCase() === 'FULFILLED') continue;
      const amt = +(k.MaterialAmount || k.QuantityAmount || 0);
      if (!amt) continue;
      rows.push({
        dir: String(c.Party || '').toUpperCase() === 'CUSTOMER' ? 'out' : 'in',
        partner: c.PartnerName || c.PartnerCode || '?',
        amt,
        due: c.DueDate || k.Deadline || c.DateEpochMs || '',
        status: c.Status || '',
        dest: k.DestinationAddressName || k.AddressName || k.DestinationAddressNaturalId || '',
      });
    }
  }
  return rows;
}
function commitmentsFor(t) {
  const rows = [];
  CFG.commitments.forEach((c, idx) => {
    if (String(c.material || '').toUpperCase() !== t) return;
    const pending = c.activeFrom ? new Date(c.activeFrom) > new Date() : false;
    const units = +c.units || 0;
    const due = c.due || 'Sat';
    const days = daysUntilWeekday(due);
    const unitsDue = c.per === 'week' ? units : units * 7;   // a week's worth for daily rates
    const overHorizon = c.per === 'week' ? units * (CFG.horizonDays / 7) : units * CFG.horizonDays;
    rows.push({ idx, who: c.counterparty, units, per: c.per, due, days, unitsDue, overHorizon,
                note: c.note || '', pending, starts: c.activeFrom || '',
                location: c.location || '', cont: c.cont || '',
                dir: c.dir || 'sell', price: +c.price || 0 });
  });
  return rows.sort((a, b) => a.days - b.days);
}
function reserveFor(t, cons, prod) {
  if (Object.prototype.hasOwnProperty.call(CFG.reserve, t)) return { value: +CFG.reserve[t] || 0, override: true };
  if (cons > 0 && CFG.reserveDays.usage > 0) return { value: cons * CFG.reserveDays.usage, override: false };
  if (prod > 0 && CFG.reserveDays.production > 0) return { value: prod * CFG.reserveDays.production, override: false };
  return { value: 0, override: false };
}

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
// Days until the next occurrence of a weekday (0 if today).
function daysUntilWeekday(name) {
  const want = String(name || 'Sat').slice(0, 3).toLowerCase();
  const idx = DAY_NAMES.findIndex(d => d.toLowerCase() === want);
  const target = idx >= 0 ? idx : 6;
  return (target - new Date().getDay() + 7) % 7;
}

// ── model ───────────────────────────────────────────────────────────────────
function buildModel() {
  const tickers = new Set();
  for (const st of DATA.storage) for (const it of (st.StorageItems || [])) {
    if (it.MaterialTicker && ((+it.MaterialAmount || +it.Amount) > 0)) tickers.add(it.MaterialTicker);
  }
  if (DATA.burn) for (const p of Object.keys(DATA.burn)) for (const r of (DATA.burn[p] || [])) tickers.add(r.MaterialTicker);
  for (const c of DATA.contracts) for (const k of (c.Conditions || [])) {
    if (String(k.Type || '').toUpperCase() === 'DELIVERY') {
      const t = k.MaterialTicker || k.QuantityMaterialTicker;
      if (t) tickers.add(t);
    }
  }
  for (const c of CFG.commitments) if (c.material) tickers.add(String(c.material).toUpperCase());
  for (const t of Object.keys(CFG.reserve)) tickers.add(t);

  MODEL = [...tickers].sort().map(t => {
    const sRows = stockRows(t);
    const stock = sRows.reduce((s, r) => s + r.amt, 0);
    const bRows = burnRows(t);
    const prod = bRows.reduce((s, r) => s + r.prod, 0);
    const cons = bRows.reduce((s, r) => s + r.cons, 0);
    const net = prod - cons;
    const cRows = contractRows(t);
    const incoming = cRows.filter(r => r.dir === 'in').reduce((s, r) => s + r.amt, 0);
    const outgoing = cRows.filter(r => r.dir === 'out').reduce((s, r) => s + r.amt, 0);
    const commitRows = commitmentsFor(t);
    const commit = commitRows.filter(r => !r.pending).reduce((s, r) => s + r.overHorizon, 0);
    const reserve = reserveFor(t, cons, prod).value;
    const free = stock + incoming + prod * CFG.horizonDays - outgoing - commit - reserve;
    const cover = net < 0 ? stock / -net : Infinity;

    // Saturday column: stock + production until Saturday, against commitments due Saturday.
    const satDays = daysUntilWeekday('Sat');
    const satNeed = commitRows.filter(r => r.due === 'Sat' && !r.pending).reduce((s, r) => s + r.unitsDue, 0);
    const satHave = stock + incoming + prod * satDays;
    const satGap = satHave - satNeed;

    // Each commitment is measured against its own due day.
    const dueRows = commitRows.map(r => {
      const have = stock + incoming + prod * r.days;
      return { ...r, have, gap: have - r.unitsDue };
    });
    const shortOne = dueRows.find(r => !r.pending && r.gap < 0) || null;

    let status = 'ok';
    if (shortOne) status = 'short';
    else if (reserve > 0 && stock < reserve) status = 'below';
    else if (net < 0 && cover < 7) status = 'fast';
    else if (dueRows.length) status = 'ready';
    return { ticker: t, name: nameOf(t), stock, prod, cons, net, cover, incoming, outgoing, commit, reserve, free, status,
             satDays, satNeed, satHave, satGap, dueRows, shortDay: shortOne ? shortOne.due : '',
             hasContracts: cRows.length > 0, hasCommitments: commitRows.length > 0, sRows, bRows, cRows };
  });

  render();
  renderCommitments();
}

// ── XIT export ──────────────────────────────────────────────────────────────
let EXPORT = { json: '', paste: '' };
let CX_CACHE = null;

// Round to the extension's 3-significant-figure price limit.
function sig3(n) {
  n = +n;
  if (!n) return 0;
  const mag = Math.floor(Math.log10(Math.abs(n)));
  const f = Math.pow(10, 2 - mag);
  return Math.round(n * f) / f;
}

async function cxPrice(ticker, dir) {
  const ex = String(CFG.defaultExchange || 'IC1').toUpperCase();
  const r = await fetch(`https://rest.fnar.net/exchange/${encodeURIComponent(ticker)}.${encodeURIComponent(ex)}`);
  if (!r.ok) throw new Error(`no ${ticker}.${ex} market (HTTP ${r.status})`);
  const d = await r.json();
  const p = dir === 'buy' ? (d.Ask || d.Price) : (d.Bid || d.Price);
  if (!p) throw new Error(`no ${dir === 'buy' ? 'ask' : 'bid'} on ${ex}`);
  return +p;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e2) { return false; }
  }
}

async function exportCommit(idx) {
  const c = CFG.commitments[idx];
  if (!c) return;
  setStatus('busy', 'Preparing XIT export…');
  let price = +c.price || 0;
  let src = 'commitment override';
  if (!price) {
    try { price = await cxPrice(c.material, c.dir); src = 'CX ' + (CFG.defaultExchange || 'IC1'); }
    catch (e) { setStatus('err', 'No price available: ' + e.message); return; }
  }
  if (!price) { setStatus('err', 'No price for ' + c.material + ' — set one on the commitment.'); return; }
  price = sig3(price);

  const units = c.per === 'week' ? (+c.units || 0) : (+c.units || 0) * 7;
  const pkg = {
    actions: [{
      type: 'CONT Trade', group: 'G1',
      contLocation: c.location || 'Configure on Execution',
      contTradeType: c.dir === 'buy' ? 'BUYING' : 'SELLING',
      daysToFulfill: 3, currency: 'AIC',
    }],
    global: { name: `Material Board — ${c.material} ${units}` },
    groups: [{ type: 'Paste', name: 'G1' }],
  };
  EXPORT.json = JSON.stringify(pkg);
  EXPORT.paste = `${c.material} ${units} ${price}`;

  const host = $('exportPanel');
  host.classList.remove('hidden');
  host.innerHTML = `<div class="subpanel" style="margin-top:12px;">
    <div class="subpanel-title">XIT export — ${esc(c.material)} ${fmt(units)} (${esc(src)})</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin:10px 12px;">
      <button class="small" onclick="copyExport('json')">COPY PACKAGE</button>
      <button class="small" onclick="copyExport('paste')">COPY PASTE LINE</button>
      <span class="muted" style="font-size:12px;">price ${price}</span>
    </div>
    <pre class="export-pre">${esc(EXPORT.json)}</pre>
    <div class="mono" style="padding:0 12px 12px;font-size:12px;">Paste line at execution: <span class="muted">${esc(EXPORT.paste)}</span></div>
  </div>`;
  const copied = await copyText(EXPORT.json);
  setStatus(copied ? 'ok' : 'err',
    copied
      ? `Package copied — price ${price} from ${src}. The paste line is shown below.`
      : `Package built (price ${price} from ${src}) but the clipboard was blocked — use COPY PACKAGE.`);
}

async function copyExport(which) {
  const text = which === 'paste' ? EXPORT.paste : EXPORT.json;
  const ok = await copyText(text);
  setStatus(ok ? 'ok' : 'err', ok ? (which === 'paste' ? 'Paste line copied.' : 'Package copied.') : 'Clipboard copy failed.');
}

// ── render list ─────────────────────────────────────────────────────────────
function statusCell(m) {
  if (m.status === 'short') return `<span class="badge bad">short for ${esc(String(m.shortDay || 'sat').toLowerCase())}</span>`;
  if (m.status === 'below') return '<span class="badge bad">below reserve</span>';
  if (m.status === 'fast')  return '<span class="badge warn">selling too fast</span>';
  if (m.status === 'ready') return '<span class="badge good">ready</span>';
  return '<span class="badge good">ok</span>';
}
function satText(m) {
  if (!m.satNeed) return '<span class="dim">—</span>';
  const cls = m.satGap < 0 ? 'bad' : 'good';
  return `<span class="${cls}">${m.satGap >= 0 ? '+' : ''}${fmt1(m.satGap)}</span>`;
}
function coverText(m) {
  if (!isFinite(m.cover)) return '<span class="dim">—</span>';
  const cls = m.cover < 7 ? 'bad' : m.cover < 14 ? 'warn' : 'good';
  return `<span class="${cls}">${fmt1(m.cover)}d</span>`;
}
function filtered() {
  let rows = MODEL;
  const q = $('searchInput').value.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.ticker.toLowerCase().includes(q) || (r.name || '').toLowerCase().includes(q));
  if (FILTER === 'below') rows = rows.filter(r => r.status === 'below');
  if (FILTER === 'fast') rows = rows.filter(r => r.status === 'fast');
  if (FILTER === 'contracts') rows = rows.filter(r => r.hasContracts);
  if (FILTER === 'commitments') rows = rows.filter(r => r.hasCommitments);
  if (FILTER === 'nostock') rows = rows.filter(r => r.stock === 0);
  return rows.slice().sort((a, b) => {
    if (SORT.key === 'status') {
      const rank = { short: 0, below: 1, fast: 2, ready: 3, ok: 4 };
      const d = rank[a.status] - rank[b.status];
      return d !== 0 ? d : a.ticker.localeCompare(b.ticker);
    }
    if (SORT.key === 'ticker') return SORT.dir * a.ticker.localeCompare(b.ticker);
    const va = a[SORT.key], vb = b[SORT.key];
    return SORT.dir * (va - vb);
  });
}
function setFilter(f) {
  FILTER = f;
  document.querySelectorAll('button.chip').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  render();
}
function sortBy(k) {
  if (SORT.key === k) SORT.dir *= -1; else { SORT.key = k; SORT.dir = k === 'ticker' ? 1 : -1; }
  render();
}

      <td class="r mono">${fmt(m.stock)}</td>
      <td class="r mono ${m.net >= 0 ? 'good' : 'bad'}">${m.net >= 0 ? '+' : ''}${fmt1(m.net)}</td>
      <td class="r mono">${coverText(m)}</td>
      <td class="r mono">${satText(m)}</td>
      <td class="r mono muted">${fmt(m.incoming)} / ${fmt(m.outgoing)}</td>
      <td class="r mono ${m.free >= 0 ? '' : 'bad'}">${fmt(m.free)}</td>
      <td>${statusCell(m)}</td>
    </tr>`;
    const detail = open ? `<tr><td colspan="8" class="detail-cell">${detailHTML(m)}</td></tr>` : '';
    return row + detail;
  }).join('');

  $('listHost').innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
}
function toggleRow(t) { OPEN = OPEN === t ? null : t; render(); }

// ── detail ──────────────────────────────────────────────────────────────────
function detailHTML(m) {
  const t = m.ticker;
  const stockTbl = m.sRows.length
    ? `<table><thead><tr><th>Location</th><th>Type</th><th class="r">Amount</th></tr></thead><tbody>
       ${m.sRows.map(r => `<tr><td class="mono">${esc(r.name)}</td><td class="muted">${esc(r.type)}</td><td class="r mono">${fmt(r.amt)}</td></tr>`).join('')}
       </tbody><tfoot><tr><td colspan="2">TOTAL</td><td class="r">${fmt(m.stock)}</td></tr></tfoot></table>`
    : '<div class="empty-state">No stock.</div>';

  const burnTbl = m.bRows.length
    ? `<table><thead><tr><th>Planet</th><th class="r">Prod/day</th><th class="r">Use/day</th><th class="r">Net/day</th></tr></thead><tbody>
       ${m.bRows.map(r => `<tr><td class="mono">${esc(r.planet)}</td><td class="r mono muted">${fmt1(r.prod)}</td><td class="r mono muted">${fmt1(r.cons)}</td><td class="r mono ${r.net >= 0 ? 'good' : 'bad'}">${r.net >= 0 ? '+' : ''}${fmt1(r.net)}</td></tr>`).join('')}
       </tbody><tfoot><tr><td>TOTAL</td><td class="r">${fmt1(m.prod)}</td><td class="r">${fmt1(m.cons)}</td><td class="r">${m.net >= 0 ? '+' : ''}${fmt1(m.net)}</td></tr></tfoot></table>`
    : '<div class="empty-state">No production or consumption.</div>';

  const contTbl = m.cRows.length
    ? `<table><thead><tr><th>Dir</th><th>Partner</th><th>Destination</th><th>Due</th><th class="r">Amount</th></tr></thead><tbody>
       ${m.cRows.map(r => `<tr>
         <td class="${r.dir === 'in' ? 'good' : 'warn'}">${r.dir === 'in' ? '← in' : '→ out'}</td>
         <td class="mono">${esc(r.partner)}</td>
         <td class="muted">${esc(r.dest || '—')}</td>
         <td class="muted mono">${esc(dateOf(r.due))}</td>
         <td class="r mono">${fmt(r.amt)}</td></tr>`).join('')}
       </tbody><tfoot><tr><td colspan="4">TOTAL</td><td class="r">in ${fmt(m.incoming)} · out ${fmt(m.outgoing)}</td></tr></tfoot></table>`
    : '<div class="empty-state">No open deliveries.</div>';

  const commits = commitmentsFor(t);
  const commitTbl = commits.length
    ? `<table><thead><tr><th>Person</th><th>Location</th><th>Cont</th><th>Due</th><th class="r">Rate</th><th class="r">Over ${CFG.horizonDays}d</th></tr></thead><tbody>
       ${commits.map(r => `<tr><td class="mono">${esc(whoName(r.who))}${r.note ? `<div class="mat-name">${esc(r.note)}</div>` : ''}</td><td class="muted">${esc(r.location || '—')}</td><td class="muted">${esc(contLabel(r.cont))}</td><td class="muted">${esc(r.due)}</td><td class="r mono muted">${fmt(r.units)}/${r.per}</td><td class="r mono">${fmt1(r.overHorizon)}</td></tr>`).join('')}
       </tbody><tfoot><tr><td colspan="5">TOTAL</td><td class="r">${fmt1(m.commit)}</td></tr></tfoot></table>`
    : '<div class="empty-state">No standing commitments.</div>';

  const res = reserveFor(t, m.cons, m.prod);
  const resBasis = res.override ? 'Override (config)'
    : m.reserve === 0 ? 'No reserve'
    : m.cons > 0 ? `Default — ${CFG.reserveDays.usage} days of usage`
    : `Default — ${CFG.reserveDays.production} days of production`;
  const resTbl = `<table><thead><tr><th>Basis</th><th class="r">Units</th></tr></thead><tbody>
      <tr><td class="muted">${esc(resBasis)}</td><td class="r mono">${fmt(m.reserve)}</td></tr>
      <tr><td class="muted">Stock now</td><td class="r mono">${fmt(m.stock)}</td></tr>
      <tr><td class="muted">${m.stock >= m.reserve ? 'Above reserve by' : 'Below reserve by'}</td>
          <td class="r mono ${m.stock >= m.reserve ? 'good' : 'bad'}">${fmt(Math.abs(m.stock - m.reserve))}</td></tr>
    </tbody></table>`;

  const satPanel = m.dueRows.length
    ? `<div class="subpanel" style="margin-top:14px;">
         <div class="subpanel-title">Commitments by due day</div>
         <table>
           <thead><tr><th>Person</th><th>Location</th><th>Cont</th><th>Due</th><th class="r">Units due</th><th class="r">Have by then</th><th class="r">Gap</th></tr></thead>
           <tbody>
             ${m.dueRows.map(r => `<tr>
               <td class="mono">${esc(whoName(r.who))}${r.note ? `<div class="mat-name">${esc(r.note)}</div>` : ''}</td>
               <td class="muted">${esc(r.location || '—')}</td>
               <td class="muted">${esc(contLabel(r.cont))}</td>
               <td class="muted">${esc(r.due)}${r.days === 0 ? ' (today)' : ` (${r.days}d)`}</td>
               <td class="r mono">${fmt1(r.unitsDue)}</td>
               <td class="r mono muted">${fmt1(r.have)}</td>
               <td class="r mono ${r.pending ? 'dim' : (r.gap >= 0 ? 'good' : 'bad')}">${r.pending ? 'starts ' + esc(dateOf(r.starts)) : ((r.gap >= 0 ? '+' : '') + fmt1(r.gap))}</td>
             </tr>`).join('')}
           </tbody>
         </table>
       </div>`
    : '';

  return `<div class="detail">
    <div class="detail-head">
      <div><div class="dstat">Stock</div><div class="dval">${fmt(m.stock)}</div></div>
      <div><div class="dstat">Reserve</div><div class="dval">${fmt(m.reserve)}</div></div>
      <div><div class="dstat">Free (${CFG.horizonDays}d)</div><div class="dval ${m.free >= 0 ? 'good' : 'bad'}">${fmt(m.free)}</div></div>
      <div><div class="dstat">Net / day</div><div class="dval ${m.net >= 0 ? 'good' : 'bad'}">${m.net >= 0 ? '+' : ''}${fmt1(m.net)}</div></div>
      <div><div class="dstat">Cover</div><div class="dval">${coverText(m)}</div></div>
    </div>
    ${satPanel}
    <div class="detail-cols">
      <div class="subpanel"><div class="subpanel-title">Stock by location</div>${stockTbl}</div>
      <div class="subpanel"><div class="subpanel-title">Production &amp; use by planet</div>${burnTbl}</div>
    </div>
    <div class="subpanel" style="margin-top:14px;"><div class="subpanel-title">Open contracts</div>${contTbl}</div>
    <div class="detail-cols" style="margin-top:14px;">
      <div class="subpanel"><div class="subpanel-title">Standing commitments</div>${commitTbl}</div>
      <div class="subpanel"><div class="subpanel-title">Reserve</div>${resTbl}</div>
    </div>
    <div class="sell-row">
      <span class="input-label">Sell check</span>
      <input id="sellQty_${t}" type="number" min="0" placeholder="qty">
      <select id="sellDest_${t}">
        <option value="to corp">to corp</option>
        <option value="to CX">to CX</option>
        <option value="to another player">to another player</option>
      </select>
      <button class="small" onclick="sellCheck('${t}')">CHECK</button>
      <span class="sell-answer" id="sellAns_${t}"></span>
    </div>
  </div>`;
}

function sellCheck(t) {
  const m = MODEL.find(x => x.ticker === t);
  if (!m) return;
  const qty = +($('sellQty_' + t).value) || 0;
  const dest = $('sellDest_' + t).value;
  const free = m.free;
  $('sellAns_' + t).innerHTML = qty <= free
    ? `<span class="yes">Yes</span> — sell ${fmt(qty)} ${esc(t)} ${esc(dest)}; ${fmt(free - qty)} left over reserve.`
    : `<span class="no">No</span> — selling ${fmt(qty)} leaves you ${fmt(qty - free)} short; you can sell ${fmt(Math.max(0, free))}.`;
}

// ── init ────────────────────────────────────────────────────────────────────
(function init() {
  document.getElementById('buildTag').textContent = BUILD;
  loadPanels();
  loadConfig();
  const user = localStorage.getItem(LS.user); if (user) $('userInput').value = user;
  const fio = localStorage.getItem(LS.fio);  if (fio)  $('fioKeyInput').value = fio;
  const pn  = localStorage.getItem(LS.pn);   if (pn)   $('pnKeyInput').value  = pn;
  ['horizonInput', 'reserveUseInput', 'reserveProdInput'].forEach(id =>
    $(id).addEventListener('change', persistSettings));
  if (fio) loadAll(false);
})();
</script>
</body>
</html>
