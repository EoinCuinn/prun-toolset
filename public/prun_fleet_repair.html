<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrUn Fleet Repair</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #181c27;
    --bg3: #1e2333;
    --border: #2a3045;
    --text: #e2e8f0;
    --text2: #ffffff;
    --text3: #ffffff;
    --accent: #4f8ef7;
    --green: #4ade80;
    --orange: #fb923c;
    --red: #f87171;
    --mono: 'Courier New', monospace;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 1.5rem;
    max-width: 1500px;
    margin: 0 auto;
  }

  h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }

  .config-row {
    display: flex;
    gap: 8px 10px;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 160px;
  }
  .field label {
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text2);
    font-family: var(--mono);
  }

  input[type="text"] {
    flex: 1;
    min-width: 160px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--mono);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input[type="text"] { flex: none; width: 100%; min-width: 0; }
  input[type="text"]:focus { border-color: var(--accent); }

  button {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  button:hover { background: var(--border); border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover { background: #6aa0f9; }

  .status {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 1rem;
    min-height: 16px;
    font-family: var(--mono);
  }

  .section-head {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    margin: 1.5rem 0 0.75rem;
  }

  /* Ship grid */
  .ship-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 8px;
  }

  .ship-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    transition: border-color 0.15s;
  }
  .ship-card:hover { border-color: var(--accent); }
  .ship-card.needs-repair { border-left: 3px solid var(--orange); }
  .ship-card.critical { border-left: 3px solid var(--red); }
  .ship-card.good { border-left: 3px solid var(--green); }

  .ship-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .ship-name {
    font-size: 13px;
    font-weight: 600;
    font-family: var(--mono);
    color: var(--text);
  }

  .ship-condition {
    font-size: 13px;
    font-weight: 700;
    font-family: var(--mono);
  }
  .condition-good { color: var(--green); }
  .condition-warn { color: var(--orange); }
  .condition-bad { color: var(--red); }

  .repair-items {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }

  .mat-pill {
    font-size: 11px;
    font-family: var(--mono);
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--orange);
  }

  .no-repairs {
    font-size: 12px;
    color: var(--text3);
  }

  /* Ship selection */
  .ship-select-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .ship-select { accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; flex-shrink: 0; }
  .ship-card.deselected { opacity: 0.45; }
  .ship-reg { font-size: 10px; font-family: var(--mono); color: var(--text2); margin-top: 2px; }
  .sel-controls { float: right; font-size: 10px; font-weight: 400; letter-spacing: 0.04em; text-transform: none; color: var(--text2); }
  .sel-controls a { color: var(--accent); text-decoration: none; }
  .sel-controls a:hover { text-decoration: underline; }

  /* Shopping grid */
  .shopping-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 8px;
  }

  .shopping-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem;
    transition: border-color 0.15s;
  }
  .shopping-item:hover { border-color: var(--accent); }
  .shopping-item.covered { border-left: 3px solid var(--green); }
  .shopping-item.partial  { border-left: 3px solid var(--orange); }
  .shopping-item.missing  { border-left: 3px solid var(--red); }

  .shopping-ticker {
    font-size: 17px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  .shopping-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }
  .shopping-row span:last-child { color: var(--text); font-weight: 500; font-family: var(--mono); }

  .buy-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .buy-row span:last-child { font-family: var(--mono); font-weight: 600; }
  .col-green  { color: var(--green); }
  .col-orange { color: var(--orange); }
  .col-red    { color: var(--red); }

  .locations { margin-top: 6px; }
  .location-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text2);
    padding: 2px 0;
    border-bottom: 1px solid var(--border);
  }
  .location-row:last-child { border-bottom: none; }
  .location-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
  .location-qty { font-family: var(--mono); color: var(--text); }

  /* Export */
  .export-section {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .export-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
  }

  .export-card-head {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .export-card-desc {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 0.75rem;
  }

  .export-output {
    font-size: 11px;
    font-family: var(--mono);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 120px;
    overflow-y: auto;
    color: var(--text2);
    margin-bottom: 8px;
  }

  .export-actions { display: flex; align-items: center; gap: 8px; }
  .copy-success { font-size: 12px; color: var(--green); font-family: var(--mono); }

  /* Two-column layout: main content (left) + XIT sidebar (right) */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 1.25rem; align-items: start; }
  #xitPanel { position: sticky; top: 4rem; }
  #xitPanel .export-section { margin-top: 0; }
  #xitPanel .section-head { margin-top: 0; }
  #xitPanel .export-output { max-height: 360px; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    #xitPanel { position: static; }
  }

  /* Summary strip */
  .summary {
    display: flex;
    gap: 1px;
    margin-bottom: 1.25rem;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .summary-stat {
    flex: 1;
    padding: 0.75rem 1rem;
    background: var(--bg2);
    text-align: center;
  }
  .summary-stat strong {
    display: block;
    font-size: 22px;
    font-weight: 700;
    font-family: var(--mono);
    margin-bottom: 2px;
  }
  .summary-stat span { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-green strong { color: var(--green); }
  .stat-orange strong { color: var(--orange); }
  .stat-red strong { color: var(--red); }
</style>
</head>
<body>

<a href="/home.html" style="position:fixed;top:16px;right:16px;background:#1e3a5f;color:#4f8ef7;border:1px solid #4f8ef7;border-radius:4px;padding:6px 12px;font-size:12px;font-family:monospace;text-decoration:none;letter-spacing:0.05em;z-index:100;">⌂ HOME</a>

<h1>Fleet Repair</h1>

<div class="config-row">
  <div class="field">
    <label for="username">PrUn Username</label>
    <input id="username" type="text" placeholder="PrUn username..." />
  </div>
  <div class="field">
    <label for="apikey">FIO REST API Key</label>
    <input id="apikey" type="text" placeholder="FIO REST API key..." />
  </div>
  <button class="primary" id="loadBtn">Load fleet ↗</button>
</div>
<div class="status" id="status">Enter your PrUn username and FIO REST API key to load fleet data.</div>
<div style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:1rem;">⚿ API key and username are saved in your browser only — never sent anywhere except FIO.</div>
<div class="layout">
  <div id="results"></div>
  <aside id="xitPanel"></aside>
</div>

<script>
function buildActJson(materials) {
  return {
    actions: [
      { group: "A1", exchange: "IC1", priceLimits: {}, buyPartial: false, useCXInv: true, name: "BuyItems", type: "CX Buy" },
      { type: "MTRA", name: "TransferAction", group: "A1", origin: "Hortus Station Warehouse", dest: "Configure on Execution" }
    ],
    global: { name: "Fleet Repair" },
    groups: [{ type: "Manual", name: "A1", materials }]
  };
}

// Fleet + inventory kept after load so ship selection can recompute without re-fetching
let _shipData = [];
let _inventory = {};

function recompute() {
  const selected = new Set([...document.querySelectorAll('.ship-select:checked')].map(cb => +cb.dataset.idx));
  document.querySelectorAll('.ship-card[data-idx]').forEach(card => {
    const cb = card.querySelector('.ship-select');
    if (cb) card.classList.toggle('deselected', !cb.checked);
  });
  const aggregate = {};
  _shipData.forEach(s => {
    if (!s.hasRepairs || !selected.has(s.idx)) return;
    s.repairs.forEach(r => { aggregate[r.ticker] = (aggregate[r.ticker] || 0) + r.qty; });
  });
  renderShopping(aggregate);
}

function renderShopping(aggregate) {
  const shoppingSection = document.getElementById('shoppingSection');
  const xitPanel = document.getElementById('xitPanel');
  if (!shoppingSection) return;
  const keys = Object.keys(aggregate).sort();

  if (keys.length === 0) {
    const anyRepairable = _shipData.some(s => s.hasRepairs);
    shoppingSection.innerHTML = '<div class="section-head">Shopping list</div><div class="status">' +
      (anyRepairable ? 'No ships selected — tick ships above to build a shopping list.' : 'No repairs needed across fleet ✓') + '</div>';
    xitPanel.innerHTML = '';
    return;
  }

  const toBuyMaterials = {};
  let html = '<div class="section-head">Shopping list — have vs need</div><div class="shopping-grid">';
  keys.forEach(ticker => {
    const needed = aggregate[ticker];
    const inv = _inventory[ticker] || { total: 0, locations: [] };
    const have = inv.total;
    const toBuy = Math.max(0, needed - have);
    const cls = toBuy === 0 ? 'covered' : (have > 0 ? 'partial' : 'missing');
    const colCls = toBuy === 0 ? 'col-green' : (have > 0 ? 'col-orange' : 'col-red');
    const buyText = toBuy === 0 ? '✓ covered' : `buy ${toBuy}`;
    if (toBuy > 0) toBuyMaterials[ticker] = toBuy;

    html += `<div class="shopping-item ${cls}">`;
    html += `<div class="shopping-ticker">${ticker}</div>`;
    html += `<div class="shopping-row"><span>Need</span><span>${needed}</span></div>`;
    html += `<div class="shopping-row"><span>Have</span><span>${have}</span></div>`;
    html += `<div class="buy-row"><span>To buy</span><span class="${colCls}">${buyText}</span></div>`;
    if (inv.locations.length > 0) {
      html += '<div class="locations">';
      html += '<div style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;margin-top:6px;">In storage</div>';
      inv.locations.slice().sort((a,b) => b.qty - a.qty).forEach(l => {
        html += `<div class="location-row"><span class="location-name">${l.name}</span><span class="location-qty">${l.qty}</span></div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  shoppingSection.innerHTML = html;

  const hasBuyItems = Object.keys(toBuyMaterials).length > 0;
  const xitStr = JSON.stringify(buildActJson(toBuyMaterials));
  xitPanel.innerHTML = `<div class="export-section">
      <div class="export-card">
        <div class="export-card-head">Buy + Transfer</div>
        <div class="export-card-desc">CX Buy missing repair materials at IC1, then MTRA from Hortus Station Warehouse → ship (configure on execution). ${hasBuyItems ? Object.keys(toBuyMaterials).length + ' item(s) to buy.' : 'Nothing to buy — all covered.'}</div>
        <div class="export-output" id="xitOut">${xitStr}</div>
        <div class="export-actions">
          <button id="copyXit">Copy to clipboard</button>
          <span class="copy-success" id="copyXitOk" style="display:none">✓ Copied!</span>
        </div>
      </div>
    </div>`;
  const copyBtn = document.getElementById('copyXit');
  if (copyBtn) copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(xitStr).then(() => {
      const s = document.getElementById('copyXitOk');
      s.style.display = 'inline';
      setTimeout(() => s.style.display = 'none', 2000);
    });
  });
}

async function loadAll() {
  const apikey = document.getElementById('apikey').value.trim();
  const username = document.getElementById('username').value.trim();
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const xitPanel = document.getElementById('xitPanel');

  if (!apikey || !username) { status.textContent = 'Please enter both fields.'; return; }
  localStorage.setItem('prun_apikey', apikey);
  localStorage.setItem('prun_username', username);
  status.textContent = 'Fetching data...';
  results.innerHTML = '';
  xitPanel.innerHTML = '';

  try {
    const [shipsRes, storageRes, sitesRes] = await Promise.all([
      fetch(`https://rest.fnar.net/ship/ships/${username}`, { headers: { 'Authorization': apikey } }),
      fetch(`https://rest.fnar.net/storage/${username}`, { headers: { 'Authorization': apikey } }),
      fetch(`https://rest.fnar.net/sites/${username}`, { headers: { 'Authorization': apikey } })
    ]);

    if (shipsRes.status === 401) { status.textContent = 'Auth failed — check API key.'; return; }
    if (!shipsRes.ok) { status.textContent = `Ships error ${shipsRes.status}.`; return; }

    const ships = await shipsRes.json();

    // SiteId → PlanetName map
    const siteMap = {};
    if (sitesRes.ok) {
      const sites = await sitesRes.json();
      sites.forEach(s => { if (s.SiteId && s.PlanetName) siteMap[s.SiteId] = s.PlanetName; });
    }

    // Inventory map
    const inventory = {};
    if (storageRes.ok) {
      const storageData = await storageRes.json();
      storageData.forEach(loc => {
        if (loc.Type === 'STL_FUEL_STORE' || loc.Type === 'FTL_FUEL_STORE') return;
        let locName = loc.Name;
        if (!locName && loc.AddressableId && siteMap[loc.AddressableId]) locName = siteMap[loc.AddressableId];
        if (!locName && loc.StorageId && siteMap[loc.StorageId]) locName = siteMap[loc.StorageId];
        if (!locName) locName = loc.Type === 'WAREHOUSE_STORE' ? 'Warehouse' : 'Unknown';
        (loc.StorageItems || []).forEach(item => {
          const ticker = item.MaterialTicker || '?';
          const qty = item.MaterialAmount || 0;
          if (qty <= 0) return;
          if (!inventory[ticker]) inventory[ticker] = { total: 0, locations: [] };
          inventory[ticker].total += qty;
          const existing = inventory[ticker].locations.find(l => l.name === locName);
          if (existing) existing.qty += qty;
          else inventory[ticker].locations.push({ name: locName, qty });
        });
      });
    }

    status.textContent = `Loaded ${ships.length} ship${ships.length !== 1 ? 's' : ''}.`;

    _inventory = inventory;

    // Per-ship repair data — kept so ship selection can recompute without re-fetching
    _shipData = ships.map((ship, idx) => {
      const reg = ship.Registration || ship.Transponder || '';
      const custom = (ship.Name && String(ship.Name).trim()) ? String(ship.Name).trim() : '';
      const name = custom || reg || '?';
      const condition = ship.Condition != null ? Math.round(ship.Condition * 100) : null;
      const repairsRaw = ship.RepairMaterials || ship.Needs || [];
      const repairs = repairsRaw.map(mat => ({
        ticker: mat.MaterialTicker || mat.Ticker || '?',
        qty: mat.MaterialAmount || mat.Amount || 1
      }));
      return { idx, name, reg, condition, repairs, hasRepairs: repairs.length > 0 };
    });

    // Fleet-wide condition summary (independent of selection)
    let shipsGood = 0, shipsWarn = 0, shipsBad = 0;
    _shipData.forEach(s => {
      if (s.condition != null && s.condition < 80) shipsBad++;
      else if (s.condition != null && s.condition < 90) shipsWarn++;
      else shipsGood++;
    });

    let html = `<div class="summary">
      <div class="summary-stat stat-green"><strong>${shipsGood}</strong><span>Good</span></div>
      <div class="summary-stat stat-orange"><strong>${shipsWarn}</strong><span>Warn</span></div>
      <div class="summary-stat stat-red"><strong>${shipsBad}</strong><span>Critical</span></div>
      <div class="summary-stat"><strong>${_shipData.length}</strong><span>Total</span></div>
    </div>`;

    // Fleet condition — ships needing repair carry a selection checkbox
    const repairCount = _shipData.filter(s => s.hasRepairs).length;
    html += `<div class="section-head">Fleet condition<span class="sel-controls">${repairCount} repairable · <a href="#" id="selAll">all</a> / <a href="#" id="selNone">none</a></span></div><div class="ship-grid">`;

    _shipData.forEach(s => {
      let condClass = 'condition-good', cardClass = 'good';
      if (s.condition != null && s.condition < 80) { condClass = 'condition-bad'; cardClass = 'critical'; }
      else if (s.condition != null && s.condition < 90) { condClass = 'condition-warn'; cardClass = 'needs-repair'; }
      const condTxt = s.condition != null ? s.condition + '%' : '?';

      const regLine = (s.reg && s.reg !== s.name) ? `<div class="ship-reg">${s.reg}</div>` : '';
      html += `<div class="ship-card ${cardClass}" data-idx="${s.idx}">`;
      if (s.hasRepairs) {
        html += `<div class="ship-header">
          <label class="ship-select-label"><input type="checkbox" class="ship-select" data-idx="${s.idx}" checked><span class="ship-name">${s.name}</span></label>
          <span class="ship-condition ${condClass}">${condTxt}</span>
        </div>`;
        html += regLine;
        html += '<div class="repair-items">';
        s.repairs.forEach(r => { html += `<span class="mat-pill">${r.qty}× ${r.ticker}</span>`; });
        html += '</div>';
      } else {
        html += `<div class="ship-header">
          <span class="ship-name">${s.name}</span>
          <span class="ship-condition ${condClass}">${condTxt}</span>
        </div>`;
        html += regLine;
        html += '<div class="no-repairs">No repairs needed ✓</div>';
      }
      html += '</div>';
    });
    html += '</div><div id="shoppingSection"></div>';

    results.innerHTML = html;

    // Wire ship selection → live recompute of shopping list + XIT
    results.querySelectorAll('.ship-select').forEach(cb => cb.addEventListener('change', recompute));
    const selAllEl = document.getElementById('selAll');
    const selNoneEl = document.getElementById('selNone');
    if (selAllEl) selAllEl.addEventListener('click', e => { e.preventDefault(); results.querySelectorAll('.ship-select').forEach(cb => cb.checked = true); recompute(); });
    if (selNoneEl) selNoneEl.addEventListener('click', e => { e.preventDefault(); results.querySelectorAll('.ship-select').forEach(cb => cb.checked = false); recompute(); });

    recompute();

  } catch(e) {
    status.textContent = 'Error: ' + e.message;
  }
}

document.getElementById('loadBtn').addEventListener('click', loadAll);
document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') loadAll(); });

// Restore saved values from localStorage
const savedKey = localStorage.getItem('prun_apikey');
const savedUser = localStorage.getItem('prun_username');
if (savedKey) document.getElementById('apikey').value = savedKey;
if (savedUser) document.getElementById('username').value = savedUser;
if (savedKey && savedUser) loadAll();
</script>
</body>
</html>
