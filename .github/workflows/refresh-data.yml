name: Refresh shipping-routes data

# The Shipping Routes page is a static snapshot: the data is fetched and
# encrypted during the site's build. This pokes Render once a day so the
# snapshot doesn't go stale. It triggers a normal deploy — nothing else.
#
# Setup (once):
#   1. Render dashboard -> prun-toolset -> Settings -> Deploy Hook -> copy URL
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret: RENDER_DEPLOY_HOOK = <that URL>

on:
  schedule:
    - cron: '14 7 * * *'   # daily at 07:14 UTC (off the :00 mark)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --max-time 60 -X POST "$HOOK"
          echo "Deploy triggered — the build will fetch fresh PUNoted data."
